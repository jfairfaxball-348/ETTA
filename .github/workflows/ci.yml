name: ETTA checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, deterministic tests and production build
        run: npm run check
      - name: Verify shared budget Lua against actual Redis
        run: node --experimental-strip-types tests/budget-integration.mjs
      - name: Package API with pinned Vercel CLI and load the built function (no credentials)
        run: |
          npm install --prefix /tmp/vercel-cli --no-audit --no-fund vercel@50.44.0
          mkdir -p .vercel
          echo '{"projectId":"prj_ci_local","orgId":"team_ci_local","settings":{"framework":"vite","installCommand":"npm ci --no-audit --no-fund","buildCommand":"npm run build","outputDirectory":"dist","rootDirectory":null}}' > .vercel/project.json
          /tmp/vercel-cli/node_modules/.bin/vercel build --yes
          node tests/vercel-function.mjs .vercel/output/functions/api/decision.func
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
      - name: Install pinned browser transport (not an app dependency)
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.56.1
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/etta-preview.log 2>&1 &
      - name: Start explicit fixture API integration server
        run: node --experimental-strip-types tests/fixture-server.mjs > /tmp/etta-fixture.log 2>&1 &
      - name: Exercise room and protected mind bridge in Chromium (provider fixtures only)
        run: |
          room_status=0
          mind_status=0
          node tests/browser-smoke.mjs || room_status=$?
          node tests/mind-browser.mjs || mind_status=$?
          exit $((room_status || mind_status))
        env:
          ETTA_BROWSER_URL: http://127.0.0.1:4173/
      - name: Archive browser screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etta-browser-evidence
          path: test-results/
          if-no-files-found: warn
